# Platform gates (platform/05 loop 4.8). Pull requests and pushes run the
# standard verify plus a quick shadow-equivalence pass; a nightly job runs the
# full shadow corpus. The owner-export comparison is local-only by design
# (platform/04 §32.4): the private fixture is never in CI.
name: platform

on:
  push:
  pull_request:
  schedule:
    - cron: '17 2 * * *'

jobs:
  verify:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: npm run shadow -- --quick

  shadow-full:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run shadow
